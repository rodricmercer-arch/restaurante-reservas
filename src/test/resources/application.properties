# Configuración SOLO para tests: reemplaza a src/main/resources/application.properties
spring.datasource.url=jdbc:h2:mem:restaurante_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas al iniciar y las borra al terminar; sin dialecto fijo (lo detecta de H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- JWT para tests ---
app.jwt.secret=clave-de-pruebas-reservas-restaurante-minimo-32-caracteres
app.jwt.expiration-minutes=60
app.jwt.issuer=reservas-restaurante