<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Mesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('mesas')}"></div>

<div class="container">
    <h3>Mesas</h3>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <a th:href="@{/admin/mesas/nueva}" class="btn btn-danger mb-4">Nueva mesa</a>

    <table class="table table-bordered bg-white">
        <thead>
        <tr><th>N°</th><th>Capacidad</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="mesa : ${mesas}">
            <td th:text="${mesa.numero}"></td>
            <td th:text="${mesa.capacidad}"></td>
            <td th:text="${mesa.estado}"></td>
            <td>
                <a th:href="@{/admin/mesas/editar/{id}(id=${mesa.id})}" class="btn btn-sm btn-outline-secondary me-1">Editar</a>
                <form th:action="@{/admin/mesas/eliminar/{id}(id=${mesa.id})}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar mesa?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
