<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('usuarios')}"></div>

<div class="container">
    <h3 th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'"></h3>

    <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" class="col-md-6" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        </div>

        <div class="mb-3">
            <label for="dni" class="form-label">DNI</label>
            <input type="text" th:field="*{dni}" class="form-control" maxlength="8"
                   th:readonly="${usuario.id != null}"
                   th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
        </div>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select th:field="*{rol}" class="form-select"
                    th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'">
                <option value="">-- Seleccione --</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password">
            <div class="form-text" th:text="${usuario.id == null} ? 'Obligatoria, mínimo 8 caracteres.' : 'Déjela vacía para mantener la actual.'"></div>
        </div>

        <button type="submit" class="btn btn-danger">Guardar</button>
        <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
