<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('usuarios')}"></div>

<div class="container">
    <h3>Usuarios</h3>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-danger mb-4">Nuevo usuario</a>

    <table class="table table-bordered bg-white">
        <thead>
        <tr><th>DNI</th><th>Nombre</th><th>Rol</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.dni}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.rol}"></td>
            <td>
                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-secondary me-1">Editar</a>
                <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar usuario?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
