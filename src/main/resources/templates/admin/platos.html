<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Carta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('platos')}"></div>

<div class="container">
    <h3>Carta del restaurante</h3>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <a th:href="@{/admin/platos/nuevo}" class="btn btn-danger mb-4">Nuevo plato</a>

    <form th:action="@{/admin/platos}" method="get" class="row g-2 mb-4 align-items-end">
        <div class="col-md-3">
            <label for="texto" class="form-label">Nombre</label>
            <input id="texto" type="text" name="texto" class="form-control" placeholder="Ej. lomo" th:value="${texto}">
        </div>
        <div class="col-md-2">
            <label for="categoria" class="form-label">Categoría</label>
            <select id="categoria" name="categoria" class="form-select">
                <option value="">Todas</option>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}" th:selected="${c == categoria}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="precioMin" class="form-label">Precio mín.</label>
            <input id="precioMin" type="number" min="0" step="0.01" name="precioMin" class="form-control" th:value="${precioMin}">
        </div>
        <div class="col-md-2">
            <label for="precioMax" class="form-label">Precio máx.</label>
            <input id="precioMax" type="number" min="0" step="0.01" name="precioMax" class="form-control" th:value="${precioMax}">
        </div>
        <div class="col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-danger">Filtrar</button>
            <a th:href="@{/admin/platos}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </form>

    <table class="table table-bordered bg-white">
        <thead>
        <tr><th>Imagen</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${platos}" class="align-middle">
            <td><div th:replace="~{fragments/layout :: platoImg(${p}, 'dish-mini')}"></div></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.categoria}"></td>
            <td>
                <a th:href="@{/admin/platos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1">Editar</a>
                <form th:action="@{/admin/platos/eliminar/{id}(id=${p.id})}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar plato?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
