<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Carta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('platos')}"></div>

<div class="container">
    <h3>Carta del restaurante</h3>

    <form th:action="@{/admin/platos}" method="post" class="row g-2 mb-4">
        <div class="col-md-3"><input type="text" name="nombre" class="form-control" placeholder="Nombre" required></div>
        <div class="col-md-3"><input type="text" name="descripcion" class="form-control" placeholder="Descripción"></div>
        <div class="col-md-2"><input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio" required></div>
        <div class="col-md-2">
            <select name="categoria" class="form-select" required>
                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>
        <div class="col-md-2"><button type="submit" class="btn btn-danger w-100">Agregar</button></div>
    </form>

    <table class="table table-bordered bg-white">
        <thead>
        <tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${platos}">
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.descripcion}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.categoria}"></td>
            <td>
                <form th:action="@{/admin/platos/eliminar/{id}(id=${p.id})}" method="post" style="display:inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar plato?');">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
