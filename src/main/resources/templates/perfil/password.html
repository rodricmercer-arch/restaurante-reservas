<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('perfil')}"></div>

<div class="container">
    <h3>Cambiar contraseña</h3>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/perfil/password}" method="post" class="col-md-6">
        <div class="mb-3">
            <label for="actual" class="form-label">Contraseña actual</label>
            <input id="actual" type="password" name="actual" class="form-control"
                   autocomplete="current-password" required>
        </div>

        <div class="mb-3">
            <label for="nueva" class="form-label">Nueva contraseña</label>
            <input id="nueva" type="password" name="nueva" class="form-control"
                   autocomplete="new-password" minlength="8" required>
            <div class="form-text">Mínimo 8 caracteres.</div>
        </div>

        <div class="mb-3">
            <label for="confirmacion" class="form-label">Confirmar nueva contraseña</label>
            <input id="confirmacion" type="password" name="confirmacion" class="form-control"
                   autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-danger">Guardar</button>
        <a th:href="@{/perfil}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
