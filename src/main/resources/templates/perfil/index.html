<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('perfil')}"></div>

<div class="container">
    <h3>Mi perfil</h3>

    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card col-md-6 p-4 mb-3">
        <dl class="row mb-0">
            <dt class="col-sm-4">Nombre</dt>
            <dd class="col-sm-8" th:text="${usuario.nombre}"></dd>

            <dt class="col-sm-4">DNI</dt>
            <dd class="col-sm-8" th:text="${usuario.dni}"></dd>

            <dt class="col-sm-4">Rol</dt>
            <dd class="col-sm-8" th:text="${usuario.rol}"></dd>

            <dt class="col-sm-4" th:if="${totalReservas != null}">Reservas</dt>
            <dd class="col-sm-8" th:if="${totalReservas != null}" th:text="${totalReservas}"></dd>
        </dl>
    </div>

    <a th:href="@{/perfil/password}" class="btn btn-danger">
        <i class="fas fa-key me-1"></i> Cambiar contraseña
    </a>
</div>
</body>
</html>
