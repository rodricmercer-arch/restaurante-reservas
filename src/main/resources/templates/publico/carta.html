<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra carta - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar('carta')}"></div>
<th:block sec:authorize="isAnonymous()">
    <div th:replace="~{fragments/layout :: modalLoginRequerido}"></div>
</th:block>

<div class="container container-narrow pb-5">

    <div class="page-header">
        <div class="eyebrow">Restaurante</div>
        <h2>Nuestra carta</h2>
        <p>Conoce nuestros platos, postres y bebidas.</p>
    </div>

    <div class="section-label">Platos principales</div>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="plato : ${principales}">
            <div class="dish-public">
                <div th:replace="~{fragments/layout :: platoImg(${plato}, 'dish-banner')}"></div>
                <div class="dish-public-body">
                    <div class="dish-name" th:text="${plato.nombre}"></div>
                    <p class="dish-desc" th:text="${plato.descripcion}"></p>
                    <div class="dish-price">S/ <span th:text="${plato.precio}"></span></div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(principales)}">
            <p class="text-muted mb-0">Pronto agregaremos opciones.</p>
        </div>
    </div>

    <div class="section-label">Postres</div>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="plato : ${postres}">
            <div class="dish-public">
                <div th:replace="~{fragments/layout :: platoImg(${plato}, 'dish-banner')}"></div>
                <div class="dish-public-body">
                    <div class="dish-name" th:text="${plato.nombre}"></div>
                    <p class="dish-desc" th:text="${plato.descripcion}"></p>
                    <div class="dish-price">S/ <span th:text="${plato.precio}"></span></div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(postres)}">
            <p class="text-muted mb-0">Pronto agregaremos opciones.</p>
        </div>
    </div>

    <div class="section-label">Bebidas</div>
    <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4" th:each="plato : ${bebidas}">
            <div class="dish-public">
                <div th:replace="~{fragments/layout :: platoImg(${plato}, 'dish-banner')}"></div>
                <div class="dish-public-body">
                    <div class="dish-name" th:text="${plato.nombre}"></div>
                    <p class="dish-desc" th:text="${plato.descripcion}"></p>
                    <div class="dish-price">S/ <span th:text="${plato.precio}"></span></div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(bebidas)}">
            <p class="text-muted mb-0">Pronto agregaremos opciones.</p>
        </div>
    </div>

    <!-- Llamada a la acción -->
    <div class="text-center mt-5">
        <p class="text-muted mb-3">¿Listo para disfrutar?</p>

        <button type="button" class="btn-reservar d-inline-block px-5" style="width:auto"
                sec:authorize="isAnonymous()"
                data-bs-toggle="modal" data-bs-target="#modalLoginRequerido">Reservar una mesa</button>

        <a th:href="@{/cliente/mesas}" class="btn-reservar d-inline-block px-5" style="width:auto"
           sec:authorize="hasRole('CLIENTE')">Reservar una mesa</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
