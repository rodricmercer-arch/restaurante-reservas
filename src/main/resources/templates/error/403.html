<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f4f2; }
        .denied-card { max-width: 460px; width: 100%; background: #fff; border-radius: 28px; padding: 40px 32px;
                       box-shadow: 0 20px 40px rgba(0,0,0,0.12); text-align: center; }
        .denied-icon { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 22px; background: #c0392b;
                       color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
        .btn-volver { background: #c0392b; color: #fff; border-radius: 12px; padding: 12px 24px; font-weight: 700; }
        .btn-volver:hover { background: #a5281a; color: #fff; }
    </style>
</head>
<body>
<div class="denied-card">
    <div class="denied-icon"><i class="fas fa-utensils"></i></div>
    <h1 class="display-4 fw-bold mb-1">403</h1>
    <h4 class="mb-3">Acceso denegado</h4>
    <p class="text-muted mb-4">Tu usuario no tiene permisos para entrar a esta sección del restaurante.</p>
    <a th:href="@{/dashboard}" class="btn btn-volver">
        <i class="fas fa-arrow-left me-1"></i> Volver a mi panel
    </a>
</div>
</body>
</html>
