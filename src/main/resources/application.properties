spring.application.name=reservas

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=8080

# --- JWT (Fase 4) ---
# En producción define la variable de entorno JWT_SECRET (mínimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-reservas-restaurante-2026-minimo-32}
app.jwt.expiration-minutes=60
app.jwt.issuer=reservas-restaurante

# --- Swagger: documentar solo la API REST, no las vistas Thymeleaf ---
springdoc.paths-to-match=/api/**

# --- Notificaciones por Telegram (Fase 7) ---
# Carga un archivo local con los secretos (token y chat id). Ese archivo NO se versiona (ver .gitignore).
# "optional:" evita que la app falle si el archivo no existe; "./" es la carpeta desde donde se ejecuta la app (raíz del proyecto).
spring.config.import=optional:file:./config-local.properties
# Interruptor general del canal. Solo se pone en true dentro de config-local.properties.
app.notificaciones.telegram.enabled=false
# Token del bot (lo entrega @BotFather). Vacío aquí: el valor real va solo en config-local.properties.
app.notificaciones.telegram.token=
# Id del chat donde llegan los avisos. Vacío aquí: el valor real va solo en config-local.properties.
app.notificaciones.telegram.chatid=