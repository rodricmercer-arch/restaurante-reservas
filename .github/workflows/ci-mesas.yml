name: CI Mesas - Pruebas

# Proposito: ejecutar todas las pruebas automaticas (usan H2, no necesitan MySQL).
# Se ejecuta al hacer push a la rama del Integrante 2 y en cada Pull Request hacia dev o main.
on:
  push:
    branches: [feature/mesas]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-mesas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar Java 17 con cache de Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B -ntp clean test

      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-pruebas-mesas
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
